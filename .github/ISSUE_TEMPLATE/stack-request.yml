name: Stack request
description: Ask for support for a new kind of repo
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: breakinggood should run repos like X
      placeholder: "Describe the repo/stack in one or two sentences."
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example repo URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
